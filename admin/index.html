<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'poppingW/poppingW.github.io',
          branch: 'main',
          base_url: 'https://blog-oauth-proxy-theta.vercel.app',
          auth_endpoint: '/api/auth'
        },
        media_folder: 'source/images',
        public_folder: '/images',
        site_url: 'https://poppingw.github.io',
        locale: 'zh_Hans',
        collections: [
          {
            name: 'posts',
            label: '博客文章',
            folder: 'source/_posts',
            create: true,
            slug: '---',
            fields: [
              { label: '标题', name: 'title', widget: 'string' },
              { label: '发布日期', name: 'date', widget: 'datetime' },
              { label: '标签', name: 'tags', widget: 'list', required: false },
              { label: '分类', name: 'categories', widget: 'list', required: false },
              { label: '封面图', name: 'cover', widget: 'image', required: false },
              { label: '正文', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
