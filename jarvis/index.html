  <style>
    :root {
      --bg: #030308;
      --surface: rgba(10, 14, 28, 0.78);
      --ink: #e8fbff;
      --muted: #6b7c8e;
      --rule: rgba(0, 240, 255, 0.16);

      --accent3: #b967ff;

      --mono: 'SFMono-Regular', Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* grid + scanlines */
    body::before {
      content: ''; position: fixed; inset: 0;
      background: linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
      background-size: 50px 50px; pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px);
      pointer-events: none; z-index: 1; opacity: .4;
    }

    .wrap { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding: 14px; }

    .neon { color: var(--accent); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
    .neon-pink { color: var(--accent2); text-shadow: 0 0 10px rgba(255,42,127,0.45); }

    /* header */
    .topbar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
    .brand { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.12em; }
    .brand span { color: var(--accent2); }
    .clock { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

    /* card */
    .card {
      background: var(--surface); border: 1px solid var(--rule); border-radius: 18px;
      padding: 14px; margin-bottom: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 20px rgba(0,240,255,0.05), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* briefing */
    .brief {
      border-left: 3px solid var(--accent2);
      padding-left: 10px;
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.5;
    }
    .brief small { color: var(--muted); display: block; margin-top: 4px; font-size: 0.7rem; }

    /* timeline */
    .timeline { position: relative; padding-left: 22px; }
    .timeline::before {
      content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }
    .task {
      position: relative; margin-bottom: 10px; padding: 12px 12px 12px 14px;
      border-radius: 14px; border: 1px solid var(--rule); background: rgba(255,255,255,0.03);
      display: flex; align-items: center; gap: 12px; transition: all .18s ease;
    }
    .task:last-child { margin-bottom: 0; }
    .task:active { transform: scale(0.985); }
    .task.active { border-color: var(--accent); box-shadow: 0 0 14px rgba(0,240,255,0.18); background: rgba(0,240,255,0.08); }
    .task.done { opacity: 0.55; border-color: rgba(57,255,20,0.3); }
    .task.past { opacity: 0.45; }
    .task .chk {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--rule);
      display: grid; place-items: center; font-size: 0.75rem; color: transparent; flex-shrink: 0;
      transition: all .2s ease;
    }
    .task.done .chk { background: var(--ok); border-color: var(--ok); color: #000; }
    .task.active .chk { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(255,255,255,0.03); }

    /* bottom nav */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(3,3,8,0.92); border-top: 1px solid var(--rule);
      backdrop-filter: blur(16px); z-index: 10;
      display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));

    .nav-btn.active { color: var(--accent); text-shadow: 0 0 10px rgba(0,240,255,0.5); }

    /* tab pages */

    /* calendar */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 0.75rem; background: rgba(255,255,255,0.03); position: relative;
    }
    .cal-day .dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 3px; }
    .cal-day.today { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
    .cal-day.past { opacity: 0.5; }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 0.62rem; color: var(--muted); }
    .cal-legend span { display: flex; align-items: center; gap: 4px; }

    /* big buttons */
    .bigbtn {
      width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--rule);
      background: rgba(0,240,255,0.08); color: var(--accent); font-size: 0.95rem; font-weight: 700;
      margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .2s;
    }
    .bigbtn:active { transform: scale(0.98); background: rgba(0,240,255,0.15); }
    .bigbtn.pink { color: var(--accent2); background: rgba(255,42,127,0.08); border-color: rgba(255,42,127,0.25); }
    .bigbtn.pink:active { background: rgba(255,42,127,0.15); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid2 .bigbtn { margin-bottom: 0; font-size: 0.82rem; padding: 14px 4px; }

    /* skill list */

      display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .skill-row:last-child { border-bottom: none; }
    .skill-lv { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.07); display: grid; place-items: center; font-size: 0.6rem; color: var(--muted); }

    .skill-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .skill-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; }

    h3 { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin: 16px 0 10px; }

    .chart-box { width: 100%; height: 240px; }

    .section-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .section-title::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  </style>

  <script src="./_shared/js/echarts.min.js"></script>
  <script>
    // ===== STATE =====
    const today = new Date();
    const militaryStart = new Date('2025-09-01');
    const militaryEnd = new Date('2025-09-14');
    const nationalDayStart = new Date('2025-10-01');
    const nationalDayEnd = new Date('2025-10-07');
    const targetDate = new Date('2029-09-28');

    function fmtDate(d) {
      return `${d.getMonth()+1}.${d.getDate()}`;
    }
    function diffDays(a,b) {
      return Math.floor((b-a)/86400000);
    }

    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent =
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      document.getElementById('todayDate').textContent =
        `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} 周${['日','一','二','三','四','五','六'][now.getDay()]}`;
      const cd = Math.max(0, diffDays(now, targetDate));
      document.getElementById('countdown').textContent = cd + '天';

      const trainDays = diffDays(militaryStart, now) + 1;
      if (now < militaryStart) {
        document.getElementById('trainDay').textContent = '未开始';
      } else if (now <= militaryEnd) {
        document.getElementById('trainDay').textContent = trainDays;
      } else {
        document.getElementById('trainDay').textContent = '已结束';
      }
    }
    updateClock();
    setInterval(updateClock, 60000);

    // ===== TODAY TIMELINE =====
    const isTraining = today >= militaryStart && today <= militaryEnd;
    let schedule = [];
    if (isTraining) {
      schedule = [
        {t:'06:30-07:00', title:'起床整理', tag:'内务', dur:30},
        {t:'07:00-07:30', title:'早训前 · 四级单词20个', tag:'英语语感', dur:20, checkable:true},
        {t:'08:00-11:30', title:'军训训练', tag:'体能', dur:210},
        {t:'12:00-12:30', title:'午饭 + 休息', tag:'恢复', dur:30},
        {t:'14:00-17:00', title:'军训训练', tag:'体能', dur:180},
        {t:'18:00-19:00', title:'晚饭 + 洗澡', tag:'恢复', dur:60},
        {t:'19:30-20:00', title:'复习今日单词 / 听听力', tag:'英语语感', dur:20, checkable:true},
        {t:'20:00-22:00', title:'自由：了解机器人战队/社团', tag:'信息收集', dur:60, checkable:true},
        {t:'22:30', title:'睡觉', tag:'恢复', dur:0}
      ];
    } else {
      schedule = [
        {t:'07:00-07:30', title:'起床 + 背单词', tag:'英语', dur:30, checkable:true},
        {t:'08:00-12:00', title:'上午课程', tag:'上课', dur:240},
        {t:'12:00-13:30', title:'午饭 + 午休', tag:'恢复', dur:90},
        {t:'14:00-17:00', title:'下午课程/自习', tag:'学习', dur:180},
        {t:'17:00-18:00', title:'运动/晚饭', tag:'恢复', dur:60},
        {t:'19:00-21:00', title:'晚自习：高数/线代/算法', tag:'核心提升', dur:120, checkable:true},
        {t:'21:00-22:00', title:'机器人相关学习/项目', tag:'专业探索', dur:60, checkable:true},
        {t:'22:30', title:'睡觉', tag:'恢复', dur:0}
      ];
    }

    let doneSet = JSON.parse(localStorage.getItem('jarvis_done') || '[]');
    function renderTimeline() {
      const container = document.getElementById('todayTimeline');
      container.innerHTML = '';
      const nowHour = today.getHours() + today.getMinutes()/60;
      let done = 0, focus = 0;
      schedule.forEach((s, idx) => {
        const start = parseInt(s.t.split(':')[0]) + parseInt(s.t.split(':')[1]?.split('-')[0] || 0)/60;
        let cls = 'task';
        const isDone = doneSet.includes(idx);
        if (isDone) { cls += ' done'; done++; if(s.checkable) focus += s.dur; }
        else if (nowHour >= start && s.t.indexOf('-') > -1) {
          const endParts = s.t.split('-')[1].split(':');
          const end = parseInt(endParts[0]) + (parseInt(endParts[1]||0)/60);
          cls += (nowHour < end) ? ' active' : ' past';
        } else if (nowHour > start) cls += ' past';

        const div = document.createElement('div');
        div.className = cls;
        div.innerHTML = `
          <div class="chk" onclick="toggleTask(${idx})">${isDone?'✓':''}</div>
          <div class="task-body">
            <div class="task-time">${s.t}</div>
            <div class="task-title">${s.title}</div>
            <div class="task-tag">${s.tag}${s.dur ? ' · '+s.dur+'min' : ''}</div>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('doneCount').textContent = done;
      document.getElementById('totalCount').textContent = schedule.filter(s=>s.checkable).length;
      document.getElementById('focusMin').textContent = focus;
    }
    function toggleTask(idx) {
      if (!schedule[idx].checkable) return;
      if (doneSet.includes(idx)) doneSet = doneSet.filter(i=>i!==idx);
      else doneSet.push(idx);
      localStorage.setItem('jarvis_done', JSON.stringify(doneSet));
      renderTimeline();
    }
    renderTimeline();

    // ===== BRIEF =====
    const briefs = [
      '今天继续军训。体能消耗大，别硬刚英语。晚上回宿舍背单词20分钟就算赢。',
      '军训第N天。你的竞争对手正在休息，你在保持英语语感，这就是差距。',
      '军训还剩X天。撑住，结束后立刻进入大学节奏。',
      '军训结束。从今天开始，每天早上7点单词、晚上算法，雷打不动。'
    ];
    function setBrief() {
      const d = diffDays(militaryStart, today) + 1;
      const left = diffDays(today, militaryEnd);
      let txt = '';
      if (today < militaryStart) txt = '军训还没开始。趁这两天把四级单词APP装好，熟悉操作。';
      else if (today <= militaryEnd) txt = `军训第${d}天，还剩${left}天。体能消耗大，晚上只背20分钟单词，别逞强。`;
      else txt = '军训已结束。贾维斯进入常规作战模式，每天任务精确到小时。';
      document.getElementById('brief').innerHTML = txt + '<small>JARVIS · 鞭策模式</small>';
    }
    setBrief();

    // ===== TAB SWITCH =====
    function switchTab(tab) {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('page-'+tab).classList.add('active');
      event.currentTarget.classList.add('active');
      if (tab === 'growth') setTimeout(initRadar, 50);
    }

    // ===== 30 DAY CALENDAR =====
    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      const start = new Date(today);
      const end = new Date(today); end.setDate(end.getDate()+29);
      document.getElementById('calRange').textContent = `${fmtDate(start)} - ${fmtDate(end)}`;
      for (let i=0;i<30;i++) {
        const d = new Date(today); d.setDate(d.getDate()+i);
        const div = document.createElement('div');
        div.className = 'cal-day';
        if (i===0) div.classList.add('today');
        if (d<militaryEnd) div.classList.add('past');

        let dotColor = '';
        let label = '';
        if (d>=militaryStart && d<=militaryEnd) { dotColor='var(--accent2)'; label='军训'; }
        else if (d>=nationalDayStart && d<=nationalDayEnd) { dotColor='var(--accent3)'; label='国庆'; }
        else if (d.getDay()===0 || d.getDay()===6) { dotColor='var(--warn)'; label='周末'; }
        else { dotColor='var(--ok)'; label='学习日'; }

        div.innerHTML = `<div>${d.getDate()}</div>${dotColor?`<div class="dot" style="background:${dotColor}"></div>`:''}`;
        div.onclick = ()=>showDayPreview(d, label);
        grid.appendChild(div);
      }
    }
    function showDayPreview(d, label) {
      const p = document.getElementById('dayPreview');
      let task = '';
      if (d>=militaryStart && d<=militaryEnd) task = '军训日：保持英语语感，单词+听力';
      else if (d>=nationalDayStart && d<=nationalDayEnd) task = '国庆假期：回家，每天1小时四级/算法保持手感';
      else if (d.getDay()===0 || d.getDay()===6) task = '周末：算法题 + 机器人资讯 + 周小结';
      else task = '学习日：课程 + 晚自习核心提升';
      p.innerHTML = `<div style="font-size:0.9rem;font-weight:700;">${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · ${label}</div><div style="font-size:0.8rem;color:var(--muted);margin-top:6px;">${task}</div>`;
    }
    renderCalendar();

    // ===== GROWTH =====
    const skills = [
      {name:'C++ / 算法', lv:25},
      {name:'高数 / 线代', lv:10},
      {name:'英语四级', lv:20},
      {name:'单片机/硬件', lv:5},
      {name:'机器人ROS', lv:0},
      {name:'科研/竞赛', lv:0}
    ];
    function renderSkills() {
      const container = document.getElementById('skillList');
      container.innerHTML = skills.map(s=>`
        <div class="skill-row">
          <div class="skill-lv">L${Math.floor(s.lv/20)}</div>
          <div class="skill-name">${s.name}</div>
          <div class="skill-bar"><div class="skill-fill" style="width:${s.lv}%"></div></div>
        </div>
      `).join('');
    }
    renderSkills();

    let radarInited = false;
    function initRadar() {
      if (radarInited) return;
      radarInited = true;
      const chart = echarts.init(document.getElementById('radarChart'), null, {renderer:'svg'});
      chart.setOption({
        animation:false,
        tooltip:{trigger:'item'},
        radar:{
          indicator:[
            {name:'算法',max:100},{name:'数学',max:100},{name:'硬件',max:100},
            {name:'英语',max:100},{name:'科研',max:100},{name:'专业',max:100}
          ],
          radius:'58%',
          axisName:{color:'var(--muted)'},
          splitArea:{areaStyle:{color:['rgba(0,240,255,0.04)','rgba(0,240,255,0.08)']}},
          axisLine:{lineStyle:{color:'rgba(0,240,255,0.15)'}},
          splitLine:{lineStyle:{color:'rgba(0,240,255,0.1)'}}
        },
        series:[{
          type:'radar',
          data:[
            {value:[25,10,5,20,0,5],name:'当前',areaStyle:{color:'rgba(255,42,127,0.25)'},lineStyle:{color:'var(--accent2)'},itemStyle:{color:'var(--accent2)'}},
            {value:[95,90,80,85,85,90],name:'目标',areaStyle:{color:'rgba(0,240,255,0.15)'},lineStyle:{color:'var(--accent)'},itemStyle:{color:'var(--accent)'}}
          ]
        }]
      });
      window.addEventListener('resize',()=>chart.resize());
    }

    // ===== ARCHIVE =====
    function logExp(type) {
      const labels = {competition:'竞赛获奖', project:'项目经历', paper:'论文/专利', intern:'实习/科研', honor:'荣誉奖项'};
      const detail = prompt(`记录【${labels[type]}】：\n格式：时间 + 事件 + 结果`);
      if (detail) {
        let arr = JSON.parse(localStorage.getItem('jv_'+type)||'[]');
        arr.push({date:new Date().toISOString().slice(0,10), detail});
        localStorage.setItem('jv_'+type, JSON.stringify(arr));
        alert('已归档至经历库');
      }
    }
    function genResume() {
      const types = {competition:'竞赛获奖', project:'项目经历', paper:'论文/专利', intern:'实习/科研', honor:'荣誉奖项'};
      let html = '<div style="border:1px solid var(--rule);border-radius:12px;padding:12px;background:rgba(0,0,0,0.25);">';
      html += '<div style="font-weight:700;color:var(--accent);margin-bottom:8px;">简历素材汇总</div>';
      let has = false;
      Object.entries(types).forEach(([k,label])=>{
        const arr = JSON.parse(localStorage.getItem('jv_'+k)||'[]');
        if (arr.length) {
          has = true;
          html += `<div style="color:var(--accent2);font-size:0.78rem;margin:6px 0;">${label}</div>`;
          arr.forEach(a=>html+=`<div style="font-size:0.72rem;margin-left:6px;margin-bottom:3px;">• ${a.date} ${a.detail}</div>`);
        }
      });
      if (!has) html += '<div style="font-size:0.75rem;color:var(--muted);">暂无经历，点击上方按钮开始记录。</div>';
      html += '</div>';
      document.getElementById('resumeOut').innerHTML = html;
    }

    // ===== PWA SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
