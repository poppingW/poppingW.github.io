  <!-- EDIT MODAL -->
  <div class="modal" id="editModal">

      <input type="text" id="editTime" placeholder="时间 例：07:00-07:30">

  <script src="./_shared/js/echarts.min.js"></script>
  <script>
    // ===== STATE =====
    const today = new Date();
    const militaryStart = new Date('2025-09-01');
    const militaryEnd = new Date('2025-09-14');
    const nationalDayStart = new Date('2025-10-01');
    const nationalDayEnd = new Date('2025-10-07');
    const targetDate = new Date('2029-09-28');

    const STORAGE_KEY = 'jarvis_tasks_v2';
    const DONE_KEY = 'jarvis_done_v2';
    const TIP_KEY = 'jarvis_tips';

    const defaultTasks = [
      {t:'06:30-07:00', title:'起床整理', tag:'内务', dur:30, checkable:false},
      {t:'07:00-07:30', title:'早训前 · 四级单词20个', tag:'英语语感', dur:20, checkable:true},
      {t:'08:00-11:30', title:'军训训练', tag:'体能', dur:210, checkable:false},
      {t:'12:00-12:30', title:'午饭 + 休息', tag:'恢复', dur:30, checkable:false},
      {t:'14:00-17:00', title:'军训训练', tag:'体能', dur:180, checkable:false},
      {t:'18:00-19:00', title:'晚饭 + 洗澡', tag:'恢复', dur:60, checkable:false},
      {t:'19:30-20:00', title:'复习今日单词 / 听听力', tag:'英语语感', dur:20, checkable:true},
      {t:'20:00-22:00', title:'了解机器人战队/社团招新', tag:'信息收集', dur:60, checkable:true},
      {t:'22:30', title:'睡觉', tag:'恢复', dur:0, checkable:false}
    ];

    let schedule = loadTasks();
    let doneSet = JSON.parse(localStorage.getItem(DONE_KEY) || '[]');
    let editingIdx = -1;

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
      return defaultTasks;
    }
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    }

    function fmtDate(d) { return `${d.getMonth()+1}.${d.getDate()}`; }
    function diffDays(a,b) { return Math.floor((b-a)/86400000); }

    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      document.getElementById('todayDate').textContent = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} 周${['日','一','二','三','四','五','六'][now.getDay()]}`;
      document.getElementById('countdown').textContent = Math.max(0, diffDays(now, targetDate)) + '天';

      let phase = '入学阶段';
      if (now < militaryStart) phase = '入学准备';
      else if (now <= militaryEnd) phase = `军训第${diffDays(militaryStart, now)+1}天`;
      else phase = '常规学习';
      document.getElementById('phaseLabel').textContent = phase;
    }
    updateClock();
    setInterval(updateClock, 60000);

    // ===== PROGRESS RING =====
    function updateProgress() {
      const total = schedule.filter(s => s.checkable).length;
      const done = doneSet.filter(i => schedule[i] && schedule[i].checkable).length;
      const pct = total ? Math.round((done/total)*100) : 0;
      document.getElementById('progressNum').textContent = pct;
      const circle = document.getElementById('progressCircle');
      const c = 2 * Math.PI * 30;
      circle.style.strokeDashoffset = c - (pct/100) * c;
      document.getElementById('doneCount').textContent = done;
      document.getElementById('totalCount').textContent = total;
    }

    // ===== TODAY TIMELINE =====
    function renderTimeline() {
      const container = document.getElementById('todayTimeline');
      container.innerHTML = '';
      const nowHour = today.getHours() + today.getMinutes()/60;
      let focus = 0;
      schedule.forEach((s, idx) => {
        const start = parseInt(s.t.split(':')[0]) + parseInt(s.t.split(':')[1]?.split('-')[0] || 0)/60;
        let cls = 'task';
        const isDone = doneSet.includes(idx);
        if (isDone) { cls += ' done'; if(s.checkable) focus += s.dur; }
        else if (nowHour >= start && s.t.indexOf('-') > -1) {
          const endParts = s.t.split('-')[1].split(':');
          const end = parseInt(endParts[0]) + (parseInt(endParts[1]||0)/60);
          cls += (nowHour < end) ? ' active' : ' past';
        } else if (nowHour > start) cls += ' past';

        const div = document.createElement('div');
        div.className = cls;
        div.innerHTML = `
          <div class="chk" onclick="toggleTask(${idx})">${isDone?'✓':''}</div>
          <div class="task-body" onclick="openEdit(${idx})">
            <div class="task-time">${s.t}</div>
            <div class="task-title">${s.title}</div>
            <div class="task-tag">${s.tag}${s.dur ? ' · '+s.dur+'min' : ''}</div>
          </div>
          <div class="task-actions">
            <button onclick="openEdit(${idx})">✎</button>
            <button onclick="deleteTask(${idx})" style="color:var(--accent2)">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('focusMin').textContent = focus;
      updateProgress();
    }
    function toggleTask(idx) {
      if (!schedule[idx].checkable) return;
      if (doneSet.includes(idx)) doneSet = doneSet.filter(i=>i!==idx);
      else doneSet.push(idx);
      localStorage.setItem(DONE_KEY, JSON.stringify(doneSet));
      renderTimeline();
    }
    function deleteTask(idx) {
      if (!confirm('删除这个任务？')) return;
      schedule.splice(idx, 1);
      doneSet = doneSet.filter(i=>i!==idx).map(i=> i>idx ? i-1 : i);
      saveTasks();
      localStorage.setItem(DONE_KEY, JSON.stringify(doneSet));
      renderTimeline();
    }
    function addTaskFromInput() {
      const input = document.getElementById('newTaskInput');
      const text = input.value.trim();
      if (!text) return;
      const parts = text.split(/\s+/);
      const t = parts[0] || '09:00';
      const durMatch = text.match(/(\d+)\s*(min|分钟)/);
      const dur = durMatch ? parseInt(durMatch[1]) : 0;
      const title = text.replace(parts[0], '').replace(/\d+\s*(min|分钟)/, '').trim() || '新任务';
      schedule.push({t, title, tag:'自定义', dur, checkable:true});
      schedule.sort((a,b)=> parseInt(a.t.split(':')[0]) - parseInt(b.t.split(':')[0]));
      saveTasks();
      input.value = '';
      renderTimeline();
    }

    // ===== EDIT MODAL =====
    function openEdit(idx) {
      editingIdx = idx;
      const s = schedule[idx];
      document.getElementById('editTime').value = s.t;
      document.getElementById('editTitle').value = s.title;
      document.getElementById('editTag').value = s.tag;
      document.getElementById('editDur').value = s.dur || '';
      document.getElementById('editCheckable').value = s.checkable ? '1' : '0';
      document.getElementById('editModal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingIdx = -1;
    }
    function saveEdit() {
      if (editingIdx < 0) return;
      schedule[editingIdx] = {
        t: document.getElementById('editTime').value,
        title: document.getElementById('editTitle').value,
        tag: document.getElementById('editTag').value,
        dur: parseInt(document.getElementById('editDur').value) || 0,
        checkable: document.getElementById('editCheckable').value === '1'
      };
      schedule.sort((a,b)=> parseInt(a.t.split(':')[0]) - parseInt(b.t.split(':')[0]));
      saveTasks();
      closeModal();
      renderTimeline();
    }

    // ===== BRIEF & TIPS =====
    function setBrief() {
      const now = new Date();
      let txt = '';
      if (now < militaryStart) {
        txt = '距军训还有' + diffDays(now, militaryStart) + '天。先把证件照、通知书、身份证、军训用品准备好。';
      } else if (now <= militaryEnd) {
        txt = `军训第${diffDays(militaryStart, now)+1}天。体能消耗大，晚上只背20分钟单词，别逞强。`;
      } else {
        txt = '军训已结束。贾维斯进入常规作战模式，课程 + 晚自习 + 竞赛科研三线并进。';
      }
      document.getElementById('brief').innerHTML = txt + '<small>JARVIS · 鞭策模式</small>';
    }
    function renderTips() {
      const now = new Date();
      const shown = JSON.parse(localStorage.getItem(TIP_KEY) || '[]');
      const tips = [];

      if (now < militaryStart) {
        tips.push({id:'idphoto', title:'入学准备 · 证件照', text:'准备一寸/两寸蓝底证件照电子版+纸质版，报到和填表都要用。'});
        tips.push({id:'party', title:'入党申请 · 开学即写', text:'军训期间或开学第一周就可以递交入党申请书，越早写优势越大。'});
        tips.push({id:'supplies', title:'军训物资', text:'防晒霜、大容量水壶、软鞋垫、针线包，网购来得及。'});
      } else if (now <= militaryEnd) {
        tips.push({id:'english', title:'军训期 · 英语语感', text:'每天只背20个四级单词+听一段听力，不追求多，保持手感就行。'});
        tips.push({id:'club', title:'社团/战队', text:'晚上打听机器人战队、电子设计协会、科协招新时间和考核内容。'});
      } else {
        tips.push({id:'routine', title:'学习节奏', text:'早7单词、晚7-9高数线代、周末算法题+竞赛信息收集。'});
      }

      const container = document.getElementById('tipsBox');
      container.innerHTML = tips.filter(t => !shown.includes(t.id)).map(t=>`
        <div class="tip">
          <div class="tip-title">${t.title}</div>
          <div>${t.text}</div>
          <div style="text-align:right;margin-top:6px;"><button onclick="dismissTip('${t.id}')" style="font-size:0.65rem;color:var(--muted);background:transparent;border:none;">我知道了</button></div>
        </div>
      `).join('');
    }
    function dismissTip(id) {
      const shown = JSON.parse(localStorage.getItem(TIP_KEY) || '[]');
      shown.push(id);
      localStorage.setItem(TIP_KEY, JSON.stringify(shown));
      renderTips();
    }
    setBrief();
    renderTips();

    // ===== TAB SWITCH =====
    function switchTab(tab) {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('page-'+tab).classList.add('active');
      event.currentTarget.classList.add('active');
      if (tab === 'growth') setTimeout(initRadar, 50);
    }

    // ===== 30 DAY CALENDAR =====
    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      const start = new Date(today);
      const end = new Date(today); end.setDate(end.getDate()+29);
      document.getElementById('calRange').textContent = `${fmtDate(start)} - ${fmtDate(end)}`;
      for (let i=0;i<30;i++) {
        const d = new Date(today); d.setDate(d.getDate()+i);
        const div = document.createElement('div');
        div.className = 'cal-day';
        if (i===0) div.classList.add('today');

        let dotColor = '', label = '';
        if (d>=militaryStart && d<=militaryEnd) { dotColor='var(--accent2)'; label='军训'; }
        else if (d>=nationalDayStart && d<=nationalDayEnd) { dotColor='var(--accent3)'; label='国庆'; }
        else if (d.getDay()===0 || d.getDay()===6) { dotColor='var(--warn)'; label='周末'; }
        else { dotColor='var(--ok)'; label='学习日'; }

        div.innerHTML = `<div>${d.getDate()}</div>${dotColor?`<div class="dot" style="background:${dotColor}"></div>`:''}`;
        div.onclick = ()=>showDayPreview(d, label);
        grid.appendChild(div);
      }
    }
    function showDayPreview(d, label) {
      const p = document.getElementById('dayPreview');
      let task = '';
      if (d>=militaryStart && d<=militaryEnd) task = '军训日：保持英语语感，单词+听力';
      else if (d>=nationalDayStart && d<=nationalDayEnd) task = '国庆假期：每天1小时四级/算法保持手感';
      else if (d.getDay()===0 || d.getDay()===6) task = '周末：算法题 + 机器人资讯 + 周小结';
      else task = '学习日：课程 + 晚自习核心提升';
      p.innerHTML = `<div style="font-size:0.9rem;font-weight:700;">${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · ${label}</div><div style="font-size:0.8rem;color:var(--muted);margin-top:6px;">${task}</div>`;
    }
    renderCalendar();

    // ===== GROWTH =====
    const skills = [
      {name:'C++ / 算法', lv:25},
      {name:'高数 / 线代', lv:10},
      {name:'英语四级', lv:20},
      {name:'单片机/硬件', lv:5},
      {name:'机器人ROS', lv:0},
      {name:'科研/竞赛', lv:0}
    ];
    function renderSkills() {
      const container = document.getElementById('skillList');
      container.innerHTML = skills.map(s=>`
        <div class="skill-row">
          <div class="skill-lv">L${Math.floor(s.lv/20)}</div>
          <div class="skill-name">${s.name}</div>
          <div class="skill-bar"><div class="skill-fill" style="width:${s.lv}%"></div></div>
        </div>
      `).join('');
    }
    renderSkills();

    let radarInited = false;
    function initRadar() {
      if (radarInited) return;
      radarInited = true;
      const chart = echarts.init(document.getElementById('radarChart'), null, {renderer:'svg'});
      chart.setOption({
        animation:false,
        tooltip:{trigger:'item'},
        radar:{
          indicator:[
            {name:'算法',max:100},{name:'数学',max:100},{name:'硬件',max:100},
            {name:'英语',max:100},{name:'科研',max:100},{name:'专业',max:100}
          ],
          radius:'58%',
          axisName:{color:'var(--muted)'},
          splitArea:{areaStyle:{color:['rgba(0,240,255,0.04)','rgba(0,240,255,0.08)']}},
          axisLine:{lineStyle:{color:'rgba(0,240,255,0.15)'}},
          splitLine:{lineStyle:{color:'rgba(0,240,255,0.1)'}}
        },
        series:[{
          type:'radar',
          data:[
            {value:[25,10,5,20,0,5],name:'当前',areaStyle:{color:'rgba(255,42,127,0.25)'},lineStyle:{color:'var(--accent2)'},itemStyle:{color:'var(--accent2)'}},
            {value:[95,90,80,85,85,90],name:'目标',areaStyle:{color:'rgba(0,240,255,0.15)'},lineStyle:{color:'var(--accent)'},itemStyle:{color:'var(--accent)'}}
          ]
        }]
      });
      window.addEventListener('resize',()=>chart.resize());
    }

    function weeklySummary() {
      const done = doneSet.length;
      const total = schedule.filter(s=>s.checkable).length;
      alert(`本周小结\n完成任务：${done}/${total}\n专注时长：${document.getElementById('focusMin').textContent}分钟\n下周继续保持早7晚9节奏。`);
    }
    function monthlySummary() {
      alert('本月大结：\n\n1. 技能成长按进度推进\n2. 竞赛/项目经历及时归档\n3. 下月重点：稳定课程GPA + 英语四级备考');
    }

    // ===== ARCHIVE =====
    function logExp(type) {
      const labels = {competition:'竞赛获奖', project:'项目经历', paper:'论文/专利', intern:'实习/科研', honor:'荣誉奖项'};
      const detail = prompt(`记录【${labels[type]}】：\n格式：时间 + 事件 + 结果`);
      if (detail) {
        let arr = JSON.parse(localStorage.getItem('jv_'+type)||'[]');
        arr.push({date:new Date().toISOString().slice(0,10), detail});
        localStorage.setItem('jv_'+type, JSON.stringify(arr));
        alert('已归档至经历库');
      }
    }
    function genResume() {
      const types = {competition:'竞赛获奖', project:'项目经历', paper:'论文/专利', intern:'实习/科研', honor:'荣誉奖项'};
      let html = '<div style="border:1px solid var(--rule);border-radius:12px;padding:12px;background:rgba(0,0,0,0.25);">';
      html += '<div style="font-weight:700;color:var(--accent);margin-bottom:8px;">简历素材汇总</div>';
      let has = false;
      Object.entries(types).forEach(([k,label])=>{
        const arr = JSON.parse(localStorage.getItem('jv_'+k)||'[]');
        if (arr.length) {
          has = true;
          html += `<div style="color:var(--accent2);font-size:0.78rem;margin:6px 0;">${label}</div>`;
          arr.forEach(a=>html+=`<div style="font-size:0.72rem;margin-left:6px;margin-bottom:3px;">• ${a.date} ${a.detail}</div>`);
        }
      });
      if (!has) html += '<div style="font-size:0.75rem;color:var(--muted);">暂无经历，点击上方按钮开始记录。</div>';
      html += '</div>';
      document.getElementById('resumeOut').innerHTML = html;
    }

    // ===== NOTIFICATIONS =====
    function requestNotify() {
      if (!('Notification' in window)) {
        alert('你的浏览器不支持推送通知'); return;
      }
      Notification.requestPermission().then(p => {
        if (p === 'granted') {
          alert('推送已开启，到点会提醒你');
          scheduleNotifications();
        } else {
          alert('需要手动在浏览器设置里允许通知');
        }
      });
    }
    function scheduleNotifications() {
      if (Notification.permission !== 'granted') return;
      schedule.forEach(s => {
        if (!s.checkable) return;
        const [h,m] = s.t.split('-')[0].split(':');
        const now = new Date();
        const t = new Date();
        t.setHours(parseInt(h), parseInt(m), 0, 0);
        if (t > now) {
          setTimeout(() => {
            new Notification('JARVIS · 任务提醒', { body: s.title, icon: './assets/icon.jpg' });
          }, t - now);
        }
      });
    }

    // ===== PWA SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    renderTimeline();
    if (Notification.permission === 'granted') scheduleNotifications();
  </script>
</body>
</html>
