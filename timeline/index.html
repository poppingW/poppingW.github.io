<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大事记 | poppingW_blog</title>
  <link rel="stylesheet" href="/custom_bg.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e8fbff;
    }

    /* ===== 导航栏 ===== */
    .tl-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(3, 3, 8, 0.6);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .tl-nav .left a {
      color: #00f0ff; text-decoration: none;
      font-family: monospace; letter-spacing: 1px; font-size: 14px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); transition: all 0.2s;
    }
    .tl-nav .left a:hover { text-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }
    .tl-nav .title {
      font-size: 18px; font-weight: 700; color: #fff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); letter-spacing: 2px;
    }

    /* ===== Hero ===== */
    .tl-hero { text-align: center; padding: 70px 20px 30px; }
    .tl-hero h1 {
      font-size: clamp(32px, 5vw, 48px); color: #fff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7), 0 0 40px rgba(0, 240, 255, 0.3);
      letter-spacing: 6px; margin-bottom: 14px;
    }
    .tl-hero .subtitle {
      color: #00f0ff; font-family: monospace; letter-spacing: 4px; font-size: 14px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .tl-hero .stats { display: flex; justify-content: center; gap: 30px; margin-top: 24px; flex-wrap: wrap; }
    .tl-hero .stat { text-align: center; }
    .tl-hero .stat .num { font-size: 28px; font-weight: 700; color: #00f0ff; font-family: monospace; text-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
    .tl-hero .stat .label { font-size: 12px; color: #8da3b6; letter-spacing: 1px; margin-top: 4px; }

    /* ===== 筛选 ===== */
    .tl-filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 50px; padding: 0 20px; }
    .tl-filter-btn {
      background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.25);
      color: #00f0ff; padding: 8px 18px; border-radius: 20px; cursor: pointer;
      font-size: 13px; transition: all 0.3s; font-family: monospace; letter-spacing: 1px;
    }
    .tl-filter-btn:hover { background: rgba(0, 240, 255, 0.18); border-color: rgba(0, 240, 255, 0.5); box-shadow: 0 0 12px rgba(0, 240, 255, 0.25); }
    .tl-filter-btn.active { background: rgba(0, 240, 255, 0.25); border-color: rgba(0, 240, 255, 0.7); box-shadow: 0 0 15px rgba(0, 240, 255, 0.35); }
    .tl-filter-btn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

    /* ===== 时间线 ===== */
    .timeline { position: relative; max-width: 1000px; margin: 0 auto; padding: 20px 0 80px; }
    .timeline-line {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.6) 5%, rgba(0, 240, 255, 0.8) 50%, rgba(0, 240, 255, 0.6) 95%, transparent 100%);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); transform: translateX(-50%);
      animation: linePulse 4s ease-in-out infinite;
    }
    @keyframes linePulse { 0%, 100% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); } 50% { box-shadow: 0 0 16px rgba(0, 240, 255, 0.6); } }

    /* ===== 事件 ===== */
    .timeline-event { position: relative; width: 50%; padding: 16px 36px; margin-bottom: 8px; }
    .timeline-event.left { left: 0; text-align: right; }
    .timeline-event.right { left: 50%; text-align: left; }

    .timeline-event .node {
      position: absolute; top: 28px; width: 14px; height: 14px; border-radius: 50%; z-index: 2;
      animation: nodePulse 2.5s ease-in-out infinite;
    }
    .timeline-event.left .node { right: -7px; }
    .timeline-event.right .node { left: -7px; }
    @keyframes nodePulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 10px currentColor; } 50% { transform: scale(1.35); box-shadow: 0 0 20px currentColor; } }

    /* 进行中事件：更激烈的脉冲 */
    .timeline-event.ongoing .node { animation: ongoingPulse 1.2s ease-in-out infinite; width: 16px; height: 16px; }
    .timeline-event.ongoing.left .node { right: -8px; }
    .timeline-event.ongoing.right .node { left: -8px; }
    @keyframes ongoingPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
      50% { transform: scale(1.6); box-shadow: 0 0 25px currentColor, 0 0 40px currentColor; }
    }

    .timeline-event.academic .node { background: #00f0ff; color: #00f0ff; }
    .timeline-event.competition .node { background: #ff2a7f; color: #ff2a7f; }
    .timeline-event.skill .node { background: #39ff14; color: #39ff14; }
    .timeline-event.association .node { background: #b967ff; color: #b967ff; }

    /* 卡片 */
    .timeline-card {
      background: rgba(10, 14, 28, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.22); border-radius: 16px; padding: 20px 24px;
      transition: all 0.3s; opacity: 0; transform: translateY(30px); display: inline-block; max-width: 420px;
    }
    .timeline-event.left .timeline-card { text-align: right; }
    .timeline-card.visible { opacity: 1; transform: translateY(0); }
    .timeline-card:hover { border-color: rgba(0, 240, 255, 0.5); box-shadow: 0 0 35px rgba(0, 240, 255, 0.18); transform: translateY(-3px); }

    /* 进行中卡片边框特殊 */
    .timeline-event.ongoing .timeline-card { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 25px rgba(0, 240, 255, 0.1); }

    /* 卡片内容 */
    .timeline-card .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .timeline-event.left .timeline-card .card-header { flex-direction: row-reverse; }
    .timeline-card .icon { font-size: 26px; }
    .timeline-card .date-range {
      color: #00f0ff; font-family: monospace; font-size: 12px; letter-spacing: 1px;
      display: flex; align-items: center; gap: 4px;
    }
    .timeline-event.left .timeline-card .date-range { justify-content: flex-end; }
    .timeline-card .ongoing-text { color: #39ff14; font-weight: bold; font-size: 11px; text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); animation: ongoingBlink 1.5s ease-in-out infinite; }
    @keyframes ongoingBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .timeline-card .title { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
    .timeline-card .description { color: #a8bdd1; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    .timeline-card .tag {
      display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 10px;
      font-family: monospace; letter-spacing: 1px; margin-bottom: 8px;
    }
    .tag-academic { background: rgba(0, 240, 255, 0.12); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); }
    .tag-competition { background: rgba(255, 42, 127, 0.12); color: #ff2a7f; border: 1px solid rgba(255, 42, 127, 0.3); }
    .tag-skill { background: rgba(57, 255, 20, 0.12); color: #39ff14; border: 1px solid rgba(57, 255, 20, 0.3); }
    .tag-association { background: rgba(185, 103, 255, 0.12); color: #b967ff; border: 1px solid rgba(185, 103, 255, 0.3); }

    .timeline-card .link {
      display: inline-block; color: #00f0ff; text-decoration: none; font-size: 13px;
      border: 1px solid rgba(0, 240, 255, 0.3); padding: 4px 14px; border-radius: 12px; transition: all 0.2s;
    }
    .timeline-card .link:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

    /* 边框颜色条 */
    .timeline-event.left .timeline-card { border-right: 3px solid transparent; }
    .timeline-event.right .timeline-card { border-left: 3px solid transparent; }
    .timeline-event.academic.left .timeline-card { border-right-color: rgba(0, 240, 255, 0.5); }
    .timeline-event.academic.right .timeline-card { border-left-color: rgba(0, 240, 255, 0.5); }
    .timeline-event.competition.left .timeline-card { border-right-color: rgba(255, 42, 127, 0.5); }
    .timeline-event.competition.right .timeline-card { border-left-color: rgba(255, 42, 127, 0.5); }
    .timeline-event.skill.left .timeline-card { border-right-color: rgba(57, 255, 20, 0.5); }
    .timeline-event.skill.right .timeline-card { border-left-color: rgba(57, 255, 20, 0.5); }
    .timeline-event.association.left .timeline-card { border-right-color: rgba(185, 103, 255, 0.5); }
    .timeline-event.association.right .timeline-card { border-left-color: rgba(185, 103, 255, 0.5); }

    /* ===== 全息展开面板 ===== */
    .holo-toggle {
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
      background: rgba(0, 240, 255, 0.06); border: 1px solid rgba(0, 240, 255, 0.2);
      color: #00f0ff; font-size: 12px; font-family: monospace; letter-spacing: 1px;
      padding: 6px 14px; border-radius: 10px; transition: all 0.25s; margin-top: 10px;
      width: 100%; user-select: none;
    }
    .holo-toggle:hover { background: rgba(0, 240, 255, 0.15); border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); }
    .holo-toggle .left-info { display: flex; align-items: center; gap: 6px; }
    .holo-toggle .arrow { transition: transform 0.3s; display: inline-block; font-size: 14px; }
    .holo-toggle.open .arrow { transform: rotate(180deg); }
    .holo-toggle .progress-bar { display: inline-flex; gap: 1px; margin-left: 6px; }
    .holo-toggle .progress-bar .seg { width: 5px; height: 10px; border-radius: 1px; background: rgba(0, 240, 255, 0.2); }
    .holo-toggle .progress-bar .seg.done { background: #39ff14; box-shadow: 0 0 4px rgba(57, 255, 20, 0.5); }

    .holo-panel {
      max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
    }
    .holo-panel.open { max-height: 600px; }

    .holo-inner {
      margin-top: 12px; padding: 14px 16px;
      background: rgba(0, 240, 255, 0.03);
      border: 1px dashed rgba(0, 240, 255, 0.2); border-radius: 10px;
      position: relative; overflow: hidden;
    }

    /* 扫描线 */
    .holo-inner::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8), transparent);
      animation: holoScan 2.5s ease-in-out infinite;
    }
    @keyframes holoScan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    /* 角标装饰 */
    .holo-inner::after {
      content: 'SUB-TASKS'; position: absolute; top: 4px; right: 8px;
      font-size: 9px; font-family: monospace; color: rgba(0, 240, 255, 0.25); letter-spacing: 2px;
    }

    .holo-subtask {
      display: flex; align-items: center; gap: 8px; padding: 5px 0;
      opacity: 0; transform: translateX(-15px); transition: all 0.3s;
    }
    .holo-subtask.visible { opacity: 1; transform: translateX(0); }
    .timeline-event.left .holo-subtask { flex-direction: row-reverse; }

    .holo-subtask .st-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .holo-subtask.done .st-dot { background: #39ff14; box-shadow: 0 0 6px #39ff14; }
    .holo-subtask.pending .st-dot { background: #ffb800; box-shadow: 0 0 6px #ffb800; animation: pendingBlink 1.5s ease-in-out infinite; }
    @keyframes pendingBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .holo-subtask .st-date {
      font-family: monospace; font-size: 11px; color: #8da3b6; min-width: 55px;
    }
    .holo-subtask .st-title { font-size: 13px; color: #c8e0ec; }
    .holo-subtask.done .st-title { color: #5a7a8c; text-decoration: line-through; text-decoration-color: rgba(57, 255, 20, 0.4); }

    .holo-subtask .st-check {
      font-size: 12px; flex-shrink: 0;
    }
    .holo-subtask.done .st-check { color: #39ff14; }
    .holo-subtask.pending .st-check { color: #ffb800; }

    /* 数据流加载条 */
    .holo-data-bar {
      margin-top: 8px; font-size: 10px; font-family: monospace; color: rgba(0, 240, 255, 0.3);
      letter-spacing: 1px;
    }

    /* ===== 移动端 ===== */
    @media (max-width: 768px) {
      .timeline-line { left: 20px; }
      .timeline-event { width: 100%; left: 0 !important; text-align: left !important; padding-left: 50px; padding-right: 10px; }
      .timeline-event .node { left: 13px !important; right: auto !important; }
      .timeline-event.left .timeline-card { text-align: left; }
      .timeline-event.left .timeline-card .card-header { flex-direction: row; }
      .timeline-event.left .timeline-card .date-range { justify-content: flex-start; }
      .timeline-event.left .holo-subtask { flex-direction: row; }
      .timeline-event.left .timeline-card { border-right: none; border-left: 3px solid; }
      .timeline-event.academic.left .timeline-card { border-left-color: rgba(0, 240, 255, 0.5); border-right-color: transparent; }
      .timeline-event.competition.left .timeline-card { border-left-color: rgba(255, 42, 127, 0.5); border-right-color: transparent; }
      .timeline-event.skill.left .timeline-card { border-left-color: rgba(57, 255, 20, 0.5); border-right-color: transparent; }
      .timeline-event.association.left .timeline-card { border-left-color: rgba(185, 103, 255, 0.5); border-right-color: transparent; }
      .tl-hero h1 { letter-spacing: 3px; }
    }

    /* ===== 编辑模式 ===== */
    .admin-toggle {
      position: fixed; bottom: 80px; right: 20px; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(10, 14, 28, 0.9); border: 1px solid rgba(0, 240, 255, 0.4); color: #00f0ff;
      font-size: 20px; cursor: pointer; z-index: 200; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.3s;
    }
    .admin-toggle:hover { box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); transform: rotate(45deg); }

    .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250; }
    .admin-overlay.open { display: block; }

    .admin-panel {
      position: fixed; top: 0; right: -520px; width: 500px; max-width: 100vw; height: 100vh;
      background: rgba(3, 3, 8, 0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(0, 240, 255, 0.2); z-index: 300; overflow-y: auto;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px;
    }
    .admin-panel.open { right: 0; }
    .admin-panel h2 { color: #00f0ff; font-size: 20px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); font-family: monospace; letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; }
    .admin-panel .close-btn { background: none; border: 1px solid rgba(0, 240, 255, 0.3); color: #00f0ff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; }
    .admin-panel .field { margin-bottom: 14px; }
    .admin-panel label { display: block; color: #8da3b6; font-size: 12px; margin-bottom: 4px; font-family: monospace; letter-spacing: 1px; }
    .admin-panel input, .admin-panel select, .admin-panel textarea {
      width: 100%; background: rgba(10, 14, 28, 0.8); border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px; padding: 8px 12px; color: #e8fbff; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .admin-panel input:focus, .admin-panel select:focus, .admin-panel textarea:focus { border-color: rgba(0, 240, 255, 0.6); box-shadow: 0 0 10px rgba(0, 240, 255, 0.15); }
    .admin-panel textarea { resize: vertical; min-height: 60px; }
    .admin-panel .btn {
      background: rgba(0, 240, 255, 0.12); border: 1px solid rgba(0, 240, 255, 0.4); color: #00f0ff;
      padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; font-family: monospace; letter-spacing: 1px;
    }
    .admin-panel .btn:hover { background: rgba(0, 240, 255, 0.25); box-shadow: 0 0 12px rgba(0, 240, 255, 0.3); }
    .admin-panel .btn.danger { border-color: rgba(255, 42, 127, 0.4); color: #ff2a7f; background: rgba(255, 42, 127, 0.08); }
    .admin-panel .btn.danger:hover { background: rgba(255, 42, 127, 0.2); box-shadow: 0 0 12px rgba(255, 42, 127, 0.3); }
    .admin-event-list { margin-top: 24px; border-top: 1px solid rgba(0, 240, 255, 0.15); padding-top: 20px; }
    .admin-event-item {
      background: rgba(10, 14, 28, 0.6); border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .admin-event-item .info { flex: 1; min-width: 0; }
    .admin-event-item .info .ev-title { color: #e8fbff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-event-item .info .ev-meta { color: #8da3b6; font-size: 12px; font-family: monospace; }
    .admin-event-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .admin-event-item .actions button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(0, 240, 255, 0.2); background: rgba(0, 240, 255, 0.08); color: #00f0ff; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .admin-event-item .actions button:hover { box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
    .admin-event-item .actions .del { border-color: rgba(255, 42, 127, 0.2); background: rgba(255, 42, 127, 0.08); color: #ff2a7f; }
    .admin-section-title { color: #00f0ff; font-size: 14px; font-family: monospace; letter-spacing: 1px; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(0, 240, 255, 0.15); }
    .admin-status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 10px 0; display: none; }
    .admin-status.show { display: block; }
    .admin-status.success { background: rgba(57, 255, 20, 0.1); border: 1px solid rgba(57, 255, 20, 0.3); color: #39ff14; }
    .admin-status.error { background: rgba(255, 42, 127, 0.1); border: 1px solid rgba(255, 42, 127, 0.3); color: #ff2a7f; }
    .admin-status.loading { background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: #00f0ff; }
    .form-row { display: flex; gap: 10px; }
    .form-row .field { flex: 1; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    /* 子任务编辑器 */
    .subtask-editor { margin-top: 16px; }
    .subtask-editor .st-item {
      display: flex; gap: 8px; align-items: center; margin-bottom: 6px; padding: 8px;
      background: rgba(10, 14, 28, 0.5); border: 1px solid rgba(0, 240, 255, 0.12); border-radius: 8px;
    }
    .subtask-editor .st-item input { font-size: 13px; padding: 6px 10px; }
    .subtask-editor .st-item .st-date-input { width: 130px; flex-shrink: 0; }
    .subtask-editor .st-item .st-title-input { flex: 1; }
    .subtask-editor .st-item .st-done-check { width: auto; margin: 0; }
    .subtask-editor .st-item .st-rm { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255, 42, 127, 0.2); background: rgba(255, 42, 127, 0.08); color: #ff2a7f; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    .subtask-editor .st-item .st-rm:hover { box-shadow: 0 0 6px rgba(255, 42, 127, 0.3); }
    .subtask-editor .st-add { margin-top: 8px; }

    .admin-panel::-webkit-scrollbar { width: 6px; }
    .admin-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .admin-panel::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 3px; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00f0ff; }
    .checkbox-row label { margin: 0; font-size: 13px; color: #e8fbff; }
  </style>
</head>
<body>

  <nav class="tl-nav">
    <div class="left"><a href="/">← 返回首页</a></div>
    <div class="title">CHRONOLOGY</div>
    <div style="width:100px"></div>
  </nav>

  <div class="tl-hero">
    <h1>大事记</h1>
    <div class="subtitle">// RECORD OF MY JOURNEY //</div>
    <div class="stats" id="tl-stats"></div>
  </div>

  <div class="tl-filters" id="tl-filters">
    <button class="tl-filter-btn active" data-filter="all">全部</button>
    <button class="tl-filter-btn" data-filter="academic"><span class="dot" style="background:#00f0ff"></span>学业里程碑</button>
    <button class="tl-filter-btn" data-filter="competition"><span class="dot" style="background:#ff2a7f"></span>竞赛与项目</button>
    <button class="tl-filter-btn" data-filter="skill"><span class="dot" style="background:#39ff14"></span>技能成长</button>
    <button class="tl-filter-btn" data-filter="association"><span class="dot" style="background:#b967ff"></span>科协与社团</button>
  </div>

  <div class="timeline" id="timeline">
    <div class="timeline-line"></div>
    <div id="timeline-events"></div>
  </div>

  <button class="admin-toggle" id="admin-toggle" title="编辑模式">⚙</button>
  <div class="admin-overlay" id="admin-overlay"></div>

  <div class="admin-panel" id="admin-panel">
    <h2><span>编辑模式</span><button class="close-btn" id="admin-close">✕</button></h2>
    <div class="admin-status" id="admin-status"></div>

    <div class="admin-section-title" id="form-title">添加新事件</div>
    <form id="event-form" onsubmit="return false">
      <input type="hidden" id="ev-index" value="-1">
      <div class="form-row">
        <div class="field">
          <label>开始日期 (YYYY-MM 或 YYYY-MM-DD)</label>
          <input type="text" id="ev-date-start" placeholder="2025-09-01" required>
        </div>
        <div class="field">
          <label>结束日期 (可选)</label>
          <input type="text" id="ev-date-end" placeholder="2025-09-14">
        </div>
      </div>
      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="ev-ongoing">
          <label for="ev-ongoing">进行中（未完待续）</label>
        </div>
      </div>
      <div class="form-row">
        <div class="field" style="max-width:120px">
          <label>图标</label>
          <input type="text" id="ev-icon" placeholder="🎓" maxlength="4">
        </div>
        <div class="field">
          <label>分类</label>
          <select id="ev-category">
            <option value="academic">学业里程碑</option>
            <option value="competition">竞赛与项目</option>
            <option value="skill">技能成长</option>
            <option value="association">科协与社团</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>标题</label>
        <input type="text" id="ev-title" placeholder="事件标题" required>
      </div>
      <div class="field">
        <label>描述</label>
        <textarea id="ev-desc" placeholder="详细描述..."></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label>链接URL (可选)</label>
          <input type="text" id="ev-link" placeholder="https://...">
        </div>
        <div class="field">
          <label>链接文字 (可选)</label>
          <input type="text" id="ev-linktext" placeholder="访问">
        </div>
      </div>

      <!-- 子任务编辑器 -->
      <div class="admin-section-title">子任务</div>
      <div class="subtask-editor" id="subtask-editor"></div>
      <button class="btn st-add" id="st-add-btn" type="button" style="font-size:12px;padding:6px 14px">+ 添加子任务</button>

      <div class="btn-row">
        <button class="btn" id="ev-save">保存事件</button>
        <button class="btn" id="ev-reset" style="opacity:0.6">清空表单</button>
      </div>
    </form>

    <div class="admin-event-list">
      <div class="admin-section-title">所有事件 (<span id="ev-count">0</span>)</div>
      <div id="admin-event-list"></div>
    </div>

    <div class="admin-section-title" style="margin-top:30px">同步到 GitHub</div>
    <div class="field">
      <label>GitHub Token</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxx">
    </div>
    <div class="btn-row">
      <button class="btn" id="gh-push">推送更新</button>
      <button class="btn" id="gh-pull">从GitHub拉取</button>
      <button class="btn" id="export-json">导出JSON</button>
    </div>
    <div style="margin-top:12px;font-size:12px;color:#5a6f82;font-family:monospace;line-height:1.6">
      Token 仅存在本地浏览器 localStorage。<br>推送后 GitHub Actions 自动重建，约1-2分钟后生效。
    </div>
  </div>

  <script src="/custom_bg.js"></script>
  <script src="/timeline/events.js"></script>
  <script>
    (function() {
      'use strict';

      var events = [];
      var activeFilter = 'all';
      var currentSubtasks = [];

      function loadEvents() {
        var stored = localStorage.getItem('timeline_events_override');
        if (stored) { try { events = JSON.parse(stored); return; } catch(e) {} }
        events = (window.TIMELINE_EVENTS || []).slice();
      }
      function saveLocal() { localStorage.setItem('timeline_events_override', JSON.stringify(events)); }

      var CATEGORIES = {
        academic: { label: '学业里程碑', color: '#00f0ff' },
        competition: { label: '竞赛与项目', color: '#ff2a7f' },
        skill: { label: '技能成长', color: '#39ff14' },
        association: { label: '科协与社团', color: '#b967ff' }
      };

      function formatDateRange(ev) {
        var s = ev.dateStart || '';
        var endPart = '';
        if (ev.ongoing) {
          endPart = '<span class="ongoing-text">进行中</span>';
        } else if (ev.dateEnd && ev.dateEnd !== ev.dateStart) {
          endPart = ev.dateEnd;
        }
        if (endPart) return s + ' ~ ' + endPart;
        return s;
      }

      function renderTimeline() {
        var container = document.getElementById('timeline-events');
        container.innerHTML = '';
        var sorted = events.slice().sort(function(a, b) {
          return (b.dateStart || '').localeCompare(a.dateStart || '');
        });
        var side = 'right';
        var visibleIndex = 0;

        sorted.forEach(function(ev) {
          if (activeFilter !== 'all' && ev.category !== activeFilter) return;

          var ongoingClass = ev.ongoing ? ' ongoing' : '';
          var div = document.createElement('div');
          div.className = 'timeline-event ' + ev.category + ' ' + side + ongoingClass;
          side = side === 'left' ? 'right' : 'left';

          var tagClass = 'tag-' + ev.category;
          var catLabel = CATEGORIES[ev.category] ? CATEGORIES[ev.category].label : ev.category;
          var linkHTML = '';
          if (ev.link) {
            linkHTML = '<a class="link" href="' + escapeHTML(ev.link) + '" target="_blank" rel="noopener">' + escapeHTML(ev.linkText || '查看链接') + '</a>';
          }

          // 子任务全息面板
          var subtaskHTML = '';
          if (ev.subtasks && ev.subtasks.length > 0) {
            var stItems = ev.subtasks.map(function(st) {
              var doneClass = st.done ? 'done' : 'pending';
              var checkIcon = st.done ? '✓' : '○';
              var stDate = st.date ? escapeHTML(st.date) : '——';
              return '<div class="holo-subtask ' + doneClass + '">' +
                '<span class="st-check">' + checkIcon + '</span>' +
                '<span class="st-dot"></span>' +
                '<span class="st-date">' + stDate + '</span>' +
                '<span class="st-title">' + escapeHTML(st.title) + '</span>' +
              '</div>';
            }).join('');
            var doneCount = ev.subtasks.filter(function(s) { return s.done; }).length;
            var totalCount = ev.subtasks.length;
            var pct = Math.round(doneCount / totalCount * 100);
            var progressSegs = '';
            for (var si = 0; si < totalCount; si++) {
              progressSegs += '<span class="seg' + (si < doneCount ? ' done' : '') + '"></span>';
            }
            subtaskHTML =
              '<div class="holo-toggle" data-idx="' + visibleIndex + '">' +
                '<span class="left-info">' +
                  '<span>▸ 子任务</span>' +
                  '<span class="progress-bar">' + progressSegs + '</span>' +
                  '<span>' + doneCount + '/' + totalCount + '</span>' +
                '</span>' +
                '<span class="arrow">▾</span>' +
              '</div>' +
              '<div class="holo-panel">' +
                '<div class="holo-inner">' + stItems +
                  '<div class="holo-data-bar">▰'.repeat(doneCount) + '▱'.repeat(totalCount - doneCount) + ' ' + pct + '%</div>' +
                '</div>' +
              '</div>';
          }

          div.innerHTML =
            '<div class="node"></div>' +
            '<div class="timeline-card">' +
              '<div class="card-header">' +
                '<span class="icon">' + escapeHTML(ev.icon || '📌') + '</span>' +
                '<span class="date-range">' + formatDateRange(ev) + '</span>' +
              '</div>' +
              '<span class="tag ' + tagClass + '">' + catLabel + '</span>' +
              '<div class="title">' + escapeHTML(ev.title) + '</div>' +
              '<div class="description">' + escapeHTML(ev.description || '') + '</div>' +
              linkHTML +
              subtaskHTML +
            '</div>';

          container.appendChild(div);

          var card = div.querySelector('.timeline-card');

          // 子任务折叠/展开
          var holoToggle = div.querySelector('.holo-toggle');
          if (holoToggle) {
            holoToggle.addEventListener('click', function() {
              var panel = this.nextElementSibling;
              var isOpen = panel.classList.toggle('open');
              this.classList.toggle('open', isOpen);
              this.querySelector('.left-info').firstChild.textContent = isOpen ? '▾ 子任务' : '▸ 子任务';
              if (isOpen) {
                var subs = panel.querySelectorAll('.holo-subtask');
                subs.forEach(function(s, i) {
                  s.classList.remove('visible');
                  setTimeout(function() { s.classList.add('visible'); }, i * 150);
                });
              }
            });
          }

          var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (entry.isIntersecting) {
                setTimeout(function() { card.classList.add('visible'); }, visibleIndex * 100);
                visibleIndex++;
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.15 });
          observer.observe(div);
        });

        renderStats();
      }

      function renderStats() {
        var stats = document.getElementById('tl-stats');
        var counts = { academic: 0, competition: 0, skill: 0, association: 0 };
        var ongoingCount = 0;
        events.forEach(function(ev) {
          if (counts[ev.category] !== undefined) counts[ev.category]++;
          if (ev.ongoing) ongoingCount++;
        });
        stats.innerHTML =
          '<div class="stat"><div class="num">' + events.length + '</div><div class="label">总事件</div></div>' +
          '<div class="stat"><div class="num">' + ongoingCount + '</div><div class="label">进行中</div></div>' +
          '<div class="stat"><div class="num">' + counts.academic + '</div><div class="label">学业</div></div>' +
          '<div class="stat"><div class="num">' + counts.competition + '</div><div class="label">竞赛</div></div>' +
          '<div class="stat"><div class="num">' + counts.skill + '</div><div class="label">技能</div></div>' +
          '<div class="stat"><div class="num">' + counts.association + '</div><div class="label">科协</div></div>';
      }

      function setupFilters() {
        var btns = document.querySelectorAll('.tl-filter-btn');
        btns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            btns.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            renderTimeline();
          });
        });
      }

      // ===== 子任务编辑器 =====
      function renderSubtaskEditor() {
        var editor = document.getElementById('subtask-editor');
        editor.innerHTML = '';
        currentSubtasks.forEach(function(st, idx) {
          var div = document.createElement('div');
          div.className = 'st-item';
          div.innerHTML =
            '<input type="text" class="st-date-input" placeholder="日期" value="' + escapeHTML(st.date || '') + '">' +
            '<input type="text" class="st-title-input" placeholder="子任务标题" value="' + escapeHTML(st.title || '') + '">' +
            '<input type="checkbox" class="st-done-check"' + (st.done ? ' checked' : '') + '>' +
            '<button class="st-rm" type="button" data-idx="' + idx + '">✕</button>';
          editor.appendChild(div);
        });
        // 删除按钮
        editor.querySelectorAll('.st-rm').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentSubtasks.splice(parseInt(this.dataset.idx), 1);
            renderSubtaskEditor();
          });
        });
      }

      function setupAdmin() {
        var toggle = document.getElementById('admin-toggle');
        var overlay = document.getElementById('admin-overlay');
        var panel = document.getElementById('admin-panel');
        var closeBtn = document.getElementById('admin-close');

        function openPanel() {
          overlay.classList.add('open'); panel.classList.add('open');
          renderAdminList();
          var token = localStorage.getItem('gh_token') || '';
          document.getElementById('gh-token').value = token;
        }
        function closePanel() { overlay.classList.remove('open'); panel.classList.remove('open'); }

        toggle.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        closeBtn.addEventListener('click', closePanel);

        // 子任务添加
        document.getElementById('st-add-btn').addEventListener('click', function() {
          currentSubtasks.push({ date: '', title: '', done: false });
          renderSubtaskEditor();
        });

        // 保存
        document.getElementById('ev-save').addEventListener('click', function() {
          var idx = parseInt(document.getElementById('ev-index').value);

          // 收集子任务
          var subtasks = [];
          var items = document.querySelectorAll('#subtask-editor .st-item');
          items.forEach(function(item) {
            var date = item.querySelector('.st-date-input').value.trim();
            var title = item.querySelector('.st-title-input').value.trim();
            var done = item.querySelector('.st-done-check').checked;
            if (title) subtasks.push({ date: date, title: title, done: done });
          });

          var data = {
            dateStart: document.getElementById('ev-date-start').value.trim(),
            dateEnd: document.getElementById('ev-date-end').value.trim(),
            ongoing: document.getElementById('ev-ongoing').checked,
            category: document.getElementById('ev-category').value,
            icon: document.getElementById('ev-icon').value.trim() || '📌',
            title: document.getElementById('ev-title').value.trim(),
            description: document.getElementById('ev-desc').value.trim(),
            link: document.getElementById('ev-link').value.trim(),
            linkText: document.getElementById('ev-linktext').value.trim(),
            subtasks: subtasks
          };

          if (!data.dateStart || !data.title) { showStatus('请填写开始日期和标题', 'error'); return; }
          if (data.ongoing) data.dateEnd = '';

          if (idx >= 0) { events[idx] = data; } else { events.push(data); }
          saveLocal(); renderTimeline(); renderAdminList(); resetForm();
          showStatus('事件已保存到本地（记得推送同步到GitHub）', 'success');
        });

        document.getElementById('ev-reset').addEventListener('click', resetForm);

        document.getElementById('export-json').addEventListener('click', function() {
          var text = 'window.TIMELINE_EVENTS = ' + JSON.stringify(events, null, 2) + ';\n';
          var blob = new Blob([text], { type: 'text/javascript' });
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = 'events.js'; a.click();
          showStatus('已导出 events.js 文件', 'success');
        });

        document.getElementById('gh-push').addEventListener('click', pushToGitHub);
        document.getElementById('gh-pull').addEventListener('click', pullFromGitHub);
        document.getElementById('gh-token').addEventListener('change', function() {
          localStorage.setItem('gh_token', this.value);
        });
      }

      function resetForm() {
        document.getElementById('ev-index').value = '-1';
        document.getElementById('ev-date-start').value = '';
        document.getElementById('ev-date-end').value = '';
        document.getElementById('ev-ongoing').checked = false;
        document.getElementById('ev-icon').value = '';
        document.getElementById('ev-category').value = 'academic';
        document.getElementById('ev-title').value = '';
        document.getElementById('ev-desc').value = '';
        document.getElementById('ev-link').value = '';
        document.getElementById('ev-linktext').value = '';
        currentSubtasks = [];
        renderSubtaskEditor();
        document.getElementById('form-title').textContent = '添加新事件';
      }

      function renderAdminList() {
        var list = document.getElementById('admin-event-list');
        document.getElementById('ev-count').textContent = events.length;
        list.innerHTML = '';
        var sorted = events.slice().sort(function(a, b) { return (b.dateStart || '').localeCompare(a.dateStart || ''); });
        sorted.forEach(function(ev) {
          var realIdx = events.indexOf(ev);
          var stCount = ev.subtasks ? ev.subtasks.length : 0;
          var ongoingBadge = ev.ongoing ? ' 🟢' : '';
          var item = document.createElement('div');
          item.className = 'admin-event-item';
          item.innerHTML =
            '<div class="info">' +
              '<div class="ev-title">' + escapeHTML((ev.icon || '📌') + ' ' + ev.title + ongoingBadge) + '</div>' +
              '<div class="ev-meta">' + escapeHTML(ev.dateStart + (ev.ongoing ? ' ~ 进行中' : (ev.dateEnd ? ' ~ ' + ev.dateEnd : '')) + ' · ' + (CATEGORIES[ev.category] ? CATEGORIES[ev.category].label : ev.category) + (stCount ? ' · ' + stCount + '个子任务' : '')) + '</div>' +
            '</div>' +
            '<div class="actions">' +
              '<button class="edit" data-idx="' + realIdx + '" title="编辑">✎</button>' +
              '<button class="del" data-idx="' + realIdx + '" title="删除">✕</button>' +
            '</div>';
          list.appendChild(item);
        });

        list.querySelectorAll('.edit').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var idx = parseInt(this.dataset.idx);
            var ev = events[idx];
            document.getElementById('ev-index').value = idx;
            document.getElementById('ev-date-start').value = ev.dateStart || '';
            document.getElementById('ev-date-end').value = ev.dateEnd || '';
            document.getElementById('ev-ongoing').checked = ev.ongoing || false;
            document.getElementById('ev-icon').value = ev.icon || '';
            document.getElementById('ev-category').value = ev.category;
            document.getElementById('ev-title').value = ev.title;
            document.getElementById('ev-desc').value = ev.description || '';
            document.getElementById('ev-link').value = ev.link || '';
            document.getElementById('ev-linktext').value = ev.linkText || '';
            currentSubtasks = (ev.subtasks || []).map(function(s) { return { date: s.date || '', title: s.title || '', done: s.done || false }; });
            renderSubtaskEditor();
            document.getElementById('form-title').textContent = '编辑事件 #' + (idx + 1);
            document.getElementById('admin-panel').scrollTop = 0;
          });
        });

        list.querySelectorAll('.del').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var idx = parseInt(this.dataset.idx);
            if (confirm('确认删除「' + events[idx].title + '」？')) {
              events.splice(idx, 1); saveLocal(); renderTimeline(); renderAdminList();
              showStatus('已删除', 'success');
            }
          });
        });
      }

      function showStatus(msg, type) {
        var el = document.getElementById('admin-status');
        el.textContent = msg; el.className = 'admin-status show ' + type;
        if (type !== 'loading') { setTimeout(function() { el.className = 'admin-status'; }, 4000); }
      }

      // ===== GitHub API =====
      function pushToGitHub() {
        var token = document.getElementById('gh-token').value.trim();
        if (!token) { showStatus('请先填写 GitHub Token', 'error'); return; }
        showStatus('正在推送到 GitHub...', 'loading');
        var content = 'window.TIMELINE_EVENTS = ' + JSON.stringify(events, null, 2) + ';\n';
        var encoded = btoa(unescape(encodeURIComponent(content)));
        fetch('https://api.github.com/repos/poppingW/poppingW.github.io/contents/source/timeline/events.js', {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        })
        .then(function(r) { if (r.status === 404) return { sha: null }; if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
          var body = { message: 'update timeline events', content: encoded, branch: 'main' };
          if (data.sha) body.sha = data.sha;
          return fetch('https://api.github.com/repos/poppingW/poppingW.github.io/contents/source/timeline/events.js', {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        })
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function() { showStatus('推送成功！网站将在1-2分钟后更新', 'success'); localStorage.removeItem('timeline_events_override'); })
        .catch(function(err) { showStatus('推送失败: ' + err.message, 'error'); });
      }

      function pullFromGitHub() {
        var token = document.getElementById('gh-token').value.trim();
        if (!token) { showStatus('请先填写 GitHub Token', 'error'); return; }
        showStatus('正在从 GitHub 拉取...', 'loading');
        fetch('https://api.github.com/repos/poppingW/poppingW.github.io/contents/source/timeline/events.js', {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        })
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
          var content = decodeURIComponent(escape(atob(data.content)));
          var match = content.match(/window\.TIMELINE_EVENTS\s*=\s*(\[[\s\S]*?\]);/);
          if (match) {
            events = JSON.parse(match[1]);
            localStorage.setItem('timeline_events_override', JSON.stringify(events));
            renderTimeline(); renderAdminList();
            showStatus('已从 GitHub 拉取最新数据', 'success');
          } else { throw new Error('无法解析 events.js'); }
        })
        .catch(function(err) { showStatus('拉取失败: ' + err.message, 'error'); });
      }

      function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      loadEvents(); setupFilters(); setupAdmin(); renderTimeline();
    })();
  </script>
</body>
</html>
